<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../styles/general.css">
    <link rel="stylesheet" href="../styles/panels.css">
    <link rel="stylesheet" href="../styles/chat.css">

</head>
<body>

    <!-- HEADER -->
    <header>
        <h1>Chat administrateurs</h1>
    </header>

    <!-- MAIN -->
    <main>
        <div id="main_content">

            <!-- Message list -->
            <div id="chat-messages"></div>

            <!-- Input bar -->
            <div id="chat-input-bar">
                <input type="text" id="chat-input" placeholder="Votre message…" maxlength="2000" autocomplete="off">
                <button id="chat-send-btn" class="btn-transparent btn-blue">Envoyer</button>
            </div>

        </div>
    </main>

    <script type="module" src="../scripts/chat.js"></script>

</body>
</html>
